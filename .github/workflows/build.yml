name: Build Windows Application

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore "src/youtube-downloader/youtube dowload.sln"

    - name: Build the Solution
      run: msbuild "src/youtube-downloader/youtube dowload.sln" /p:Configuration=Release /p:Platform="Any CPU"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: youtube-downloader-release
        path: src/youtube-downloader/bin/Release/
        retention-days: 5
