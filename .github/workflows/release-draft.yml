name: Release Draft (Windows + macOS ARM64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm numarası (örn. 2.1.0)'
        required: true
        default: '2.1.0'
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Windows (.NET 4.8.1 WinForms) Derleme ve Paketleme
    runs-on: windows-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: MSBuild Kurulumu
        uses: microsoft/setup-msbuild@v2

      - name: NuGet Kurulumu
        uses: NuGet/setup-nuget@v2

      - name: NuGet Paketlerini Geri Yükle
        run: nuget restore "src/youtube-downloader/youtube dowload.sln"

      - name: Inno Setup Kurulumu
        run: choco install innosetup --no-progress

      - name: Windows Release Derle
        run: msbuild "src/youtube-downloader/youtube dowload.sln" /p:Configuration=Release /p:Platform="Any CPU"

      - name: Windows Dağıtım Paketlerini Oluştur (ZIP & Inno Setup)
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.version || github.ref_name }}".TrimStart('v')
          $binDir = "src\youtube-downloader\bin\Release"

          # Inno Setup için Publish klasörünü hazırla
          New-Item -ItemType Directory -Path "Publish" -Force
          Copy-Item "$binDir\*" -Destination "Publish" -Recurse -Exclude *.pdb

          # Inno Setup ile kurulum programını derle
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$ver" installer.iss

          # Taşınabilir (Portable) ZIP paketini oluştur
          $portDir = "YouTubeDownloader_v${ver}_Windows"
          New-Item -ItemType Directory -Path $portDir -Force
          Copy-Item "$binDir\*" -Destination $portDir -Recurse -Exclude *.pdb
          Compress-Archive -Path "$portDir\*" -DestinationPath "$portDir.zip" -Force

      - name: Windows Çıktılarını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            VideoDownloader-Setup.exe
            YouTubeDownloader_*_Windows.zip

  build-macos:
    name: macOS Apple Silicon (.NET 8 Avalonia ARM64) Derleme
    runs-on: macos-14
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: .NET 8 SDK Kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: macOS .app, ZIP ve DMG Paketini Oluştur
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          chmod +x scripts/*.sh
          ./scripts/build-macos-app.sh "${VERSION}" Release

      - name: macOS Çıktılarını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            artifacts/YouTubeDownloader_*_macOS_ARM64.zip
            artifacts/YouTubeDownloader_*_macOS_ARM64.dmg

  create-draft-release:
    name: GitHub Releases Taslak (Draft) Oluştur
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Tüm Paketleri İndir
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Sağlama Özetleri (SHA-256) ve Manifest Hazırla
        run: |
          mkdir -p final-dist
          find release-assets/ -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.dmg" \) -exec cp {} final-dist/ \;
          cd final-dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: GitHub Release Taslağını (Draft) Yayımla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version != '' && (startsWith(github.event.inputs.version, 'v') && github.event.inputs.version || format('v{0}', github.event.inputs.version)) || (startsWith(github.ref_name, 'v') && github.ref_name || 'v2.1.0') }}
          draft: true
          prerelease: false
          name: "YouTube ve Video İndirici ${{ github.event.inputs.version != '' && (startsWith(github.event.inputs.version, 'v') && github.event.inputs.version || format('v{0}', github.event.inputs.version)) || (startsWith(github.ref_name, 'v') && github.ref_name || 'v2.1.0') }}"
          files: |
            final-dist/*
            update-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
